<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PGBloom — PostgreSQL Infrastructure for Developers</title>
  <meta name="description" content="PGBloom is a PostgreSQL-native developer infrastructure library providing CRUD, caching, Bloom Filters, queues, locks, events, scheduling, rate limiting, authentication and more.">
  <meta property="og:title" content="PGBloom — PostgreSQL Infrastructure for Developers">
  <meta property="og:description" content="A developer-first infrastructure layer for PostgreSQL. Cache, queue, lock, schedule, rate-limit, authenticate, and more — all on PostgreSQL.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PGBloom — PostgreSQL Infrastructure for Developers">
  <meta name="twitter:description" content="A developer-first infrastructure layer for PostgreSQL.">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #111118;
      --bg-tertiary: #1a1a24;
      --bg-card: #14141c;
      --border: #2a2a3a;
      --border-subtle: #1e1e2e;
      --text-primary: #e8e8f0;
      --text-secondary: #a0a0b8;
      --text-muted: #6a6a80;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.15);
      --accent-green: #22c55e;
      --accent-green-glow: rgba(34, 197, 94, 0.15);
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-cyan: #06b6d4;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', 'Courier New', monospace;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 80px;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* Animated background */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    .bg-grid::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .bg-grid::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(99, 102, 241, 0.06) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 60%, rgba(34, 197, 94, 0.04) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 80%, rgba(6, 182, 212, 0.04) 0%, transparent 50%);
      animation: bgDrift 20s ease-in-out infinite;
    }
    @keyframes bgDrift {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(1%, -1%) rotate(0.5deg); }
      66% { transform: translate(-1%, 1%) rotate(-0.5deg); }
    }

    /* Navigation */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 64px;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      padding: 0 24px;
      transition: var(--transition);
    }
    .navbar.scrolled {
      border-bottom-color: var(--border);
      box-shadow: 0 1px 20px rgba(0,0,0,0.3);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    .nav-brand svg {
      width: 28px;
      height: 28px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      transition: var(--transition);
    }
    .nav-links a:hover {
      color: var(--text-primary);
      background: rgba(255,255,255,0.04);
    }
    .nav-links .btn-nav {
      background: var(--accent);
      color: #fff;
      padding: 6px 18px;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }
    .nav-links .btn-nav:hover {
      background: var(--accent-light);
      color: #fff;
    }
    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 8px;
      margin-left: auto;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 64px;
      left: 0;
      width: 260px;
      height: calc(100vh - 64px);
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-subtle);
      overflow-y: auto;
      padding: 20px 0;
      z-index: 50;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .sidebar-section {
      padding: 0 16px;
      margin-bottom: 8px;
    }
    .sidebar-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 8px 12px 4px;
    }
    .sidebar a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      border-radius: var(--radius-sm);
      transition: var(--transition);
      border-left: 2px solid transparent;
    }
    .sidebar a:hover {
      color: var(--text-primary);
      background: rgba(255,255,255,0.03);
    }
    .sidebar a.active {
      color: var(--accent-light);
      background: var(--accent-glow);
      border-left-color: var(--accent);
      font-weight: 500;
    }

    /* Main content */
    .main {
      margin-left: 260px;
      padding-top: 64px;
      min-height: 100vh;
    }
    .content {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 48px 120px;
    }

    /* Sections */
    .section {
      margin-bottom: 80px;
      scroll-margin-top: 80px;
    }
    .section-hero {
      padding: 120px 0 80px;
      text-align: center;
      position: relative;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: var(--accent-glow);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--accent-light);
      margin-bottom: 24px;
    }
    .hero-badge .dot {
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .hero-title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #fff 0%, #a0a0c0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-subtitle {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto 32px;
      line-height: 1.6;
    }
    .hero-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition);
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
    }
    .btn-primary:hover {
      background: var(--accent-light);
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--bg-card);
      border-color: var(--text-muted);
    }
    .hero-chips {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .chip {
      padding: 4px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-subtle);
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
      font-family: var(--font-mono);
    }

    /* Section headers */
    .section-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      color: var(--text-primary);
    }
    .section-subtitle {
      font-size: 1.05rem;
      color: var(--text-secondary);
      margin-bottom: 32px;
      max-width: 640px;
      line-height: 1.6;
    }
    .section-header {
      margin-bottom: 40px;
    }
    .section-divider {
      border: none;
      border-top: 1px solid var(--border-subtle);
      margin: 0;
    }

    /* Cards */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      transition: var(--transition);
    }
    .card:hover {
      border-color: var(--border);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      font-size: 1.2rem;
    }
    .card-icon.purple { background: rgba(99, 102, 241, 0.12); }
    .card-icon.green { background: rgba(34, 197, 94, 0.12); }
    .card-icon.amber { background: rgba(245, 158, 11, 0.12); }
    .card-icon.cyan { background: rgba(6, 182, 212, 0.12); }
    .card-icon.rose { background: rgba(244, 63, 94, 0.12); }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Code blocks */
    .code-block {
      position: relative;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin: 20px 0;
    }
    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: var(--bg-tertiary);
      border-bottom: 1px solid var(--border-subtle);
    }
    .code-lang {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .code-copy {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      cursor: pointer;
      transition: var(--transition);
      font-family: var(--font-mono);
    }
    .code-copy:hover {
      color: var(--text-primary);
      border-color: var(--text-muted);
    }
    .code-copy.copied {
      color: var(--accent-green);
      border-color: var(--accent-green);
    }
    .code-block pre {
      padding: 20px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      line-height: 1.7;
      color: var(--text-secondary);
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .code-block pre::-webkit-scrollbar { height: 4px; }
    .code-block pre::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .code-block code .kw { color: #c792ea; }
    .code-block code .fn { color: #82aaff; }
    .code-block code .str { color: #c3e88d; }
    .code-block code .num { color: #f78c6c; }
    .code-block code .cm { color: #546e7a; font-style: italic; }
    .code-block code .op { color: #89ddff; }

    /* Architecture diagram */
    .arch-diagram {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 40px 24px;
      overflow-x: auto;
      text-align: center;
    }
    .arch-svg {
      max-width: 100%;
      height: auto;
    }

    /* Tables */
    .doc-table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 0.85rem;
    }
    .doc-table th {
      text-align: left;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }
    .doc-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }
    .doc-table tr:hover td {
      background: rgba(255,255,255,0.02);
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-green { background: var(--accent-green-glow); color: var(--accent-green); }
    .badge-purple { background: var(--accent-glow); color: var(--accent-light); }
    .badge-amber { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); }
    .badge-cyan { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); }

    /* Search */
    .search-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 120px;
    }
    .search-overlay.visible {
      display: flex;
    }
    .search-modal {
      width: 90%;
      max-width: 560px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .search-input {
      width: 100%;
      padding: 16px 20px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 1rem;
      font-family: var(--font-sans);
      outline: none;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-results {
      max-height: 400px;
      overflow-y: auto;
      padding: 8px;
    }
    .search-result {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
    }
    .search-result:hover, .search-result.active {
      background: rgba(255,255,255,0.04);
    }
    .search-result-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
    }
    .search-result-section {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Footer */
    .footer {
      border-top: 1px solid var(--border-subtle);
      padding: 48px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .footer-links {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .footer-links a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: var(--transition);
    }
    .footer-links a:hover { color: var(--text-primary); }

    /* Mobile */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 150;
      }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .content { padding: 24px 20px 80px; }
      .nav-links { display: none; }
      .mobile-menu-btn { display: block; }
      .card-grid { grid-template-columns: 1fr; }
      .hero-actions { flex-direction: column; align-items: center; }
      .sidebar-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 140;
        display: none;
      }
      .sidebar-overlay.open { display: block; }
    }

    /* Animations */
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Kbd shortcut hint */
    kbd {
      padding: 2px 6px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .search-hint {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-md);
    }
    .search-hint:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }
    @media (max-width: 768px) {
      .search-hint { display: none; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Timeline */
    .timeline {
      position: relative;
      padding-left: 32px;
      margin: 24px 0;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 8px;
      top: 4px;
      bottom: 4px;
      width: 2px;
      background: linear-gradient(180deg, var(--accent), var(--accent-green), var(--accent-cyan));
      border-radius: 1px;
    }
    .timeline-item {
      position: relative;
      padding-bottom: 24px;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -28px;
      top: 6px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
    }
    .timeline-desc {
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- Search overlay -->
  <div class="search-overlay" id="searchOverlay" role="dialog" aria-label="Search documentation">
    <div class="search-modal">
      <input type="text" class="search-input" id="searchInput" placeholder="Search documentation..." autocomplete="off" aria-label="Search">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <!-- Search hint -->
  <button class="search-hint" id="searchHint" aria-label="Search documentation">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    Search <kbd>Ctrl+K</kbd>
  </button>

  <!-- Navigation -->
