name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test on Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Validate package entrypoints
        run: npm run build && npm run test:esm && npm run test:cjs

      - name: Run unit tests
        run: npm test

      - name: Run Docker PostgreSQL suite
        run: npm run test:docker

      - name: Validate ESM and CommonJS entrypoints
        run: bun run test:esm && bun run test:cjs

      - name: Run coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          path: coverage/
          if-no-files-found: error

      - name: Run build
        run: npm run build

  test-deno:
    name: Test on Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check JSR entrypoint
        run: deno run -A --check=none --sloppy-imports --node-modules-dir --config jsr.json mod.ts

      - name: Run Deno smoke test
        run: deno test --no-check --sloppy-imports --no-config test/deno-smoke.test.ts

  test-bun:
    name: Test on Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun run typecheck

      - name: Build package
        run: bun run build

      - name: Run Bun unit tests
        run: bun run test:bun

      - name: Run Docker PostgreSQL suite
        run: npm run test:docker
